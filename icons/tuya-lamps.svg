<?xml version="1.0" encoding="UTF-8"?>
<!-- Tuya Lamps application icon: a light bulb with a multi-colour glass. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.35" stop-color="#ffc857"/>
      <stop offset="0.7" stop-color="#5fd3f3"/>
      <stop offset="1" stop-color="#7b6cf6"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="0.5" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft glow behind the bulb -->
  <circle cx="32" cy="24" r="24" fill="url(#glow)"/>

  <!-- glass -->
  <path d="M23 41 C15.5 35.5 12.5 29 13.5 21.5 C15 11.5 23 5 32 5 C41 5 49 11.5 50.5 21.5
           C51.5 29 48.5 35.5 41 41 L40 46 L24 46 Z"
        fill="url(#glass)" stroke="#1f2937" stroke-opacity="0.35" stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- highlight -->
  <ellipse cx="24.5" cy="17" rx="5" ry="7.5" transform="rotate(-25 24.5 17)"
           fill="#ffffff" opacity="0.45"/>

  <!-- filament -->
  <path d="M26 41 L28 30 L30.5 33 L32 28 L33.5 33 L36 30 L38 41"
        fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- screw base -->
  <rect x="23" y="46" width="18" height="11" rx="2.5" fill="url(#base)"/>
  <path d="M23.5 50 H40.5 M23.5 53.5 H40.5" stroke="#374151" stroke-width="1.2"/>
  <path d="M27 57 H37 L35 60.5 H29 Z" fill="#374151"/>
</svg>
